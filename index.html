<style>
:root{--bg:#EDF1F3;--card:#fff;--ink:#14212B;--mute:#5B6B76;--line:#CBD5DB;--accent:#0F6E7A;--ok:#1E7B4F;--okbg:#DDF0E5;--bad:#B3392F;--badbg:#F7DEDA;--flag:#B7791F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1418;--card:#151F25;--ink:#E6EDF0;--mute:#93A4AE;--line:#2A3A43;--accent:#4FB6C4;--ok:#5BC48C;--okbg:#14301F;--bad:#F0877D;--badbg:#3A1B18;--flag:#E0A94A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1418;--card:#151F25;--ink:#E6EDF0;--mute:#93A4AE;--line:#2A3A43;--accent:#4FB6C4;--ok:#5BC48C;--okbg:#14301F;--bad:#F0877D;--badbg:#3A1B18;--flag:#E0A94A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;color:var(--accent);margin-bottom:12px}
header h1{margin:0;font-size:20px;color:var(--ink)}
nav{display:flex;gap:8px;margin-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
nav button,.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:8px}
nav button.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 8px}
.seg{display:flex;gap:8px;margin:8px 0 14px}
select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:6px 0 14px}
.primary{width:100%;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;margin-top:6px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{padding:10px 14px;border:1px solid var(--line);background:transparent;border-radius:8px}
.mute{color:var(--mute);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stem{font:19px/1.55 Georgia,"Times New Roman",serif;margin:12px 0 16px;max-width:60ch}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:12px;margin-bottom:8px;border:1px solid var(--line);background:var(--card);border-radius:8px}
.opt b{min-width:22px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.exp{padding:12px;border-radius:8px;margin:12px 0;border-left:4px solid}
.exp.good{background:var(--okbg);border-color:var(--ok)}
.exp.miss{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.big{font-size:44px;font-weight:700;line-height:1.1}
.trow{margin-bottom:12px}
.trow div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer}
.flag{color:var(--flag)}
.dg{width:100%;max-width:440px;height:auto;display:block;margin:10px 0}
.dg text{font:12.5px -apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.dg text.m{fill:var(--mute)}
.dg .l{stroke:var(--ink);fill:none;stroke-width:1.5}
.dg .b{stroke:var(--ink);fill:none;stroke-width:3}
.dg .a{stroke:var(--accent);fill:none;stroke-width:2}
.dg .r{stroke:var(--bad);fill:none;stroke-width:2}
.dg .g{stroke:var(--mute);fill:none;stroke-width:1.5;stroke-dasharray:4 3}
.dg .f{fill:var(--accent);fill-opacity:.3}
.dg .fa{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:1.5}
.dg .ma{fill:var(--accent);fill-opacity:.65;stroke:var(--accent)}
.dg .t{fill:var(--line);fill-opacity:.7}
.dg .w{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.dg .br{fill:var(--accent);fill-opacity:.5}
.dg .st{fill:var(--ink)}
.dg .k{fill:var(--ink);fill-opacity:.55}
.sync{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;margin-bottom:14px;background:var(--card);font-size:14px}
.sync.ok{border-left-color:var(--ok)}
.sync.warn{border-left-color:var(--flag)}
.sync.wait{border-left-color:var(--mute)}
.sync .ghost{margin-top:8px}
textarea{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
</style>

<script>
// Question bank and diagrams. Add new questions at the end of the Q list.
var Q=[
["Waves","What is the period of a 5 MHz ultrasound wave?",["0.2 µs","0.5 µs","2 µs","5 µs"],0,"Period is the inverse of frequency: 1 ÷ 5,000,000 Hz = 0.2 µs."],
["Waves","What is the average speed of sound in soft tissue?",["330 m/s","1,540 m/s","3,500 m/s","4,080 m/s"],1,"The assumed average for soft tissue is 1,540 m/s. Scanners use this value to place echoes at the correct depth."],
["Waves","A pulse takes 39 µs to travel to a reflector and back. How deep is the reflector?",["1.5 cm","3 cm","6 cm","9 cm"],1,"The 13 µs rule: every 13 µs of round-trip time equals 1 cm of depth. 39 ÷ 13 = 3 cm."],
["Transducers","Increasing the transducer frequency will most likely:",["Improve penetration and worsen axial resolution","Worsen penetration and improve axial resolution","Improve both penetration and axial resolution","Worsen both penetration and axial resolution"],1,"Higher frequency gives shorter wavelengths and pulses, so axial resolution improves. Attenuation rises with frequency, so penetration falls."],
["Resolution","Which change improves axial resolution?",["Longer spatial pulse length","Lower frequency","Wider beam","Shorter spatial pulse length"],3,"Axial resolution equals half the spatial pulse length. A shorter pulse, from more damping or higher frequency, gives better axial resolution."],
["Physics","What determines the percentage of sound reflected at a boundary at normal incidence?",["Difference in acoustic impedance","Difference in frequency","Pulse repetition frequency","Transducer diameter"],0,"Reflection depends on the impedance mismatch between the two media. Impedance equals density times propagation speed. A bigger mismatch means a stronger echo."],
["Physics","Refraction requires which two conditions?",["Normal incidence and equal speeds","Normal incidence and different speeds","Oblique incidence and different speeds","Oblique incidence and equal speeds"],2,"Refraction needs an oblique angle and a change in propagation speed between media, as described by Snell’s law."],
["Attenuation","Soft tissue attenuates about 0.5 dB per cm per MHz. What is the total attenuation for 4 MHz sound traveling to a reflector 5 cm deep and back?",["5 dB","10 dB","20 dB","40 dB"],2,"Coefficient = 0.5 × 4 = 2 dB/cm. Round-trip distance = 10 cm. 2 × 10 = 20 dB."],
["Doppler","The Doppler shift is greatest when the angle between the beam and the flow is:",["0°","45°","60°","90°"],0,"Shift is proportional to the cosine of the angle. Cosine of 0° is 1 (maximum) and cosine of 90° is 0 (no shift)."],
["Doppler","Which change helps reduce aliasing in pulsed-wave Doppler?",["Use a higher-frequency transducer","Decrease the velocity scale (PRF)","Use a lower-frequency transducer","Decrease the Doppler angle toward 0°"],2,"Aliasing occurs when the Doppler shift exceeds the Nyquist limit (half the PRF). A lower frequency reduces the shift. Raising the scale or shifting the baseline also helps."],
["Artifacts","A duplicate image of a structure appears deeper than a strong reflector such as the diaphragm. This is:",["Shadowing","Enhancement","Mirror image","Side lobe"],2,"Sound bounces off the strong reflector and returns by a longer path, so the scanner draws a copy deeper than the real structure."],
["Artifacts","Posterior acoustic enhancement is typically seen behind:",["A gallstone","A simple fluid-filled cyst","Bone","Calcified plaque"],1,"Fluid attenuates very little, so tissue behind a cyst receives more sound and looks brighter. Stones, bone, and calcification cause shadowing instead."],
["Artifacts","Equally spaced, repeating echoes deep to two strong parallel reflectors are called:",["Reverberation","Refraction","Speckle","Range ambiguity"],0,"Sound bounces back and forth between the reflectors. Each round trip adds another echo, and the scanner places them at equal intervals deeper."],
["Doppler","Which Doppler mode does not alias?",["Pulsed-wave","Color Doppler","Duplex pulsed-wave","Continuous-wave"],3,"Continuous-wave Doppler transmits and receives constantly, so there is no sampling limit. The trade-off is that it has no range resolution."],
["Instrumentation","Which change decreases frame rate?",["Decreasing imaging depth","Narrowing the sector width","Adding more focal zones","Reducing line density"],2,"Each added focal zone needs extra pulses per scan line, so each frame takes longer. Greater depth, wider sectors, and higher line density also lower frame rate."],
["Safety","The mechanical index (MI) is an estimate of the likelihood of:",["Aliasing","Tissue heating","Attenuation","Cavitation"],3,"MI relates to the risk of cavitation. The thermal index (TI) relates to tissue heating."],
["Safety","The ALARA principle means exposure should be:",["Adjusted according to patient age","Always set to maximum output","Avoided in all pregnancies","As low as reasonably achievable"],3,"ALARA stands for as low as reasonably achievable. Use the lowest output and shortest scan time that still gives a diagnostic answer."],
["Transducers","What is the ideal thickness of a transducer’s matching layer?",["One wavelength","One-half wavelength","One-quarter wavelength","Twice the wavelength"],2,"A quarter-wavelength matching layer improves sound transmission between the high-impedance crystal and the lower-impedance skin."],
["Hemodynamics","Blood flows through a stenosis. Compared with the vessel before the narrowing, the flow at the narrowest point has:",["Higher velocity and lower pressure","Lower velocity and higher pressure","Unchanged velocity","Higher velocity and higher pressure"],0,"By the continuity equation, velocity rises where the area shrinks. By Bernoulli’s principle, pressure drops where velocity rises."],
["Resolution","Lateral resolution is best:",["At the transducer surface","In the far field","Where pulse length is shortest","At the focus, where the beam is narrowest"],3,"Lateral resolution equals beam width, which is smallest at the focus."],
["Anatomy","In the parasternal long-axis view, which structure lies directly in front of (anterior to) the aortic root?",["Left atrium","Right ventricular outflow tract","Descending aorta","Coronary sinus"],1,"The right ventricular outflow tract sits at the top of the image, closest to the transducer. The left atrium is behind the aortic root."],

function W(x0,x1,cyc,amp,y){var p="",n=Math.max(24,Math.round((x1-x0)/2));for(var i=0;i<=n;i++){var x=x0+(x1-x0)*i/n;p+=(i?"L":"M")+x.toFixed(1)+" "+(y-amp*Math.sin(2*Math.PI*cyc*i/n)).toFixed(1)}return p}
function AR(x1,y1,x2,y2,c){var a=Math.atan2(y2-y1,x2-x1),h=7,l=Math.PI/7;return '<path class="'+c+'" d="M'+x1+' '+y1+'L'+x2+' '+y2+'"/><path class="'+c+'" d="M'+(x2-h*Math.cos(a-l)).toFixed(1)+' '+(y2-h*Math.sin(a-l)).toFixed(1)+'L'+x2+' '+y2+'L'+(x2-h*Math.cos(a+l)).toFixed(1)+' '+(y2-h*Math.sin(a+l)).toFixed(1)+'"/>'}
function TX(x,y,t,c,a){return '<text x="'+x+'" y="'+y+'"'+(c?' class="'+c+'"':'')+(a?' text-anchor="'+a+'"':'')+'>'+t+'</text>'}

};
function dg(id,pos){var m=IMG[id];return m&&m.p==pos?'<svg class="dg" role="img" aria-label="'+m.alt+'" viewBox="'+m.vb+'">'+m.s+'</svg>':""}

var T=[];Q.forEach(function(q){if(T.indexOf(q[0])<0)T.push(q[0])});
var KEY="spi_practice_v1",D={stats:{},flags:{},sessions:[],days:{}};
try{var L=JSON.parse(localStorage.getItem(KEY));if(L&&L.stats)D=L}catch(e){}
D.days=D.days||{};D.sessions=D.sessions||[];D.flags=D.flags||{};
function dkey(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
var bk="",bm="";
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function showBk(m){bk=(bk==m?"":m);bm="";progress()}
function doRestore(){var t=document.getElementById("rt").value;try{var R=JSON.parse(t);if(!R||!R.stats)throw 0;D=R;D.days=D.days||{};D.sessions=D.sessions||[];D.flags=D.flags||{};save();bk="";bm="Backup restored.";progress()}catch(e){bm="That text is not a valid backup.";progress()}}
function backupCard(){return '<div class="card"><h2>Backup</h2><p class="mute">Your progress is saved on this phone. Show a backup now and then and keep it in Notes.</p><div class="row"><button class="ghost" onclick="showBk(\'show\')">Show backup</button><button class="ghost" onclick="showBk(\'restore\')">Restore</button></div>'+(bm?'<p>'+bm+'</p>':"")+(bk=="show"?'<textarea readonly rows="5" onfocus="this.select()">'+esc(JSON.stringify(D))+'</textarea>':"")+(bk=="restore"?'<textarea id="rt" rows="5" placeholder="Paste backup here"></textarea><button class="primary" onclick="doRestore()">Restore this backup</button>':"")+'</div>'}
var S=null,view="home",mode="tutor",topic="All",armed=false,A=document.getElementById("app");
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function rec(id,ok){var s=D.stats[id]||{a:0,c:0};s.a++;if(ok)s.c++;s.l=ok?1:0;D.stats[id]=s;var k=dkey(new Date()),d=D.days[k]||{a:0,c:0};d.a++;if(ok)d.c++;D.days[k]=d;save()}
function todayA(){var d=D.days[dkey(new Date())];return d?d.a:0}
function logSession(){var n=0,sc=0;S.ids.forEach(function(id){if(S.ans[id]!==undefined){n++;if(S.ans[id]===Q[id][3])sc++}});if(!n)return;var e=null;D.sessions.forEach(function(x){if(x.d==S.sid)e=x});if(!e){e={d:S.sid};D.sessions.push(e)}e.s=sc;e.n=n;e.p=S.ids.length;e.m=S.mode;save()}
function commitTest(){if(S.mode=="test"&&!S.committed){S.committed=1;S.ids.forEach(function(id){if(S.ans[id]!==undefined)rec(id,S.ans[id]===Q[id][3])})}}
function pct(c,a){return a?Math.round(100*c/a):0}
function ids(f){var r=[];Q.forEach(function(q,i){if(f(q,i))r.push(i)});return r}
function nav(){var p=view=="progress";return '<nav><button class="'+(p?"":"on")+'" onclick="go(\'home\')">Practice</button><button class="'+(p?"on":"")+'" onclick="go(\'progress\')">Progress</button></nav>'}
function go(v){if(view=="quiz"&&S){commitTest();logSession()}view=v;armed=false;draw()}
function draw(){window.scrollTo(0,0);({home:home,quiz:quiz,result:result,progress:progress})[view]()}
function start(list){if(!list.length)return;S={ids:shuffle(list),i:0,mode:mode,ans:{},sid:Date.now()};view="quiz";draw()}
function home(){
var pool=ids(function(q){return topic=="All"||q[0]==topic});
var missed=ids(function(q,i){return D.stats[i]&&D.stats[i].l===0});
var flagged=ids(function(q,i){return D.flags[i]});
var seen=Object.keys(D.stats).length;
A.innerHTML=nav()+'<div class="card"><h2>New session</h2><div class="mute">Mode</div><div class="seg"><button class="'+(mode=="tutor"?"on":"")+'" onclick="mode=\'tutor\';draw()">Tutor</button><button class="'+(mode=="test"?"on":"")+'" onclick="mode=\'test\';draw()">Test</button></div><div class="mute">'+(mode=="tutor"?"Tutor shows the answer and explanation after each question.":"Test hides answers until you finish, like the real exam.")+'</div><label class="mute" for="t" style="display:block;margin-top:14px">Topic</label><select id="t" onchange="topic=this.value;draw()"><option>All</option>'+T.map(function(t){return '<option'+(t==topic?" selected":"")+'>'+t+'</option>'}).join("")+'</select><button class="primary" onclick="start(ids(function(q){return topic==\'All\'||q[0]==topic}))">Start '+pool.length+' questions</button></div>'+
'<div class="card"><h2>Review</h2><div class="row"><button class="ghost" '+(missed.length?"":"disabled")+' onclick="start(ids(function(q,i){return D.stats[i]&&D.stats[i].l===0}))">Missed ('+missed.length+')</button><button class="ghost" '+(flagged.length?"":"disabled")+' onclick="start(ids(function(q,i){return D.flags[i]}))">Flagged ('+flagged.length+')</button></div><p class="mute">You have seen '+seen+' of '+Q.length+' questions. Today: '+todayA()+' of 20 answered.</p></div>'}
function quiz(){
var id=S.ids[S.i],q=Q[id],sel=S.ans[id],tutor=S.mode=="tutor",shown=tutor&&sel!==undefined,n=S.ids.length;
var opts=q[2].map(function(o,k){var c="opt";if(shown){if(k==q[3])c+=" ok";else if(k==sel)c+=" bad"}else if(k===sel)c+=" sel";return '<button class="'+c+'" onclick="pick('+k+')" '+(shown?"disabled":"")+'><b>'+"ABCD"[k]+'</b><span>'+o+'</span></button>'}).join("");
var ex=shown?'<div class="exp '+(sel==q[3]?"good":"miss")+'"><strong>'+(sel==q[3]?"Correct.":"Incorrect.")+'</strong> '+q[4]+dg(id,"exp")+'</div>':"";
var last=S.i==n-1;
A.innerHTML=nav()+'<div class="card"><div class="row" style="margin:0 0 8px"><span class="mute">Question '+(S.i+1)+' of '+n+' · '+q[0]+'</span><button class="ghost" onclick="flip('+id+')" aria-pressed="'+!!D.flags[id]+'"><span class="'+(D.flags[id]?"flag":"")+'">'+(D.flags[id]?"Flagged":"Flag")+'</span></button></div><div class="bar"><i style="width:'+(100*S.i/n)+'%"></i></div><p class="stem">'+q[1]+'</p>'+dg(id,"stem")+opts+ex+'<button class="primary" id="nx" '+(tutor&&sel===undefined?"disabled":"")+' onclick="next()">'+(last?"Finish session":"Next question")+'</button><div class="row"><button class="ghost" onclick="go(\'home\')">End session</button><span class="mute">Keys: 1–4 to answer, Enter for next</span></div></div>'}
function flip(id){if(D.flags[id])delete D.flags[id];else D.flags[id]=1;save();draw()}
function pick(k){var id=S.ids[S.i];if(S.mode=="tutor"){if(S.ans[id]!==undefined)return;S.ans[id]=k;rec(id,k==Q[id][3]);logSession()}else S.ans[id]=k;draw()}
function next(){if(S.i<S.ids.length-1){S.i++;draw()}else finish()}
function finish(){commitTest();logSession();var sc=0;S.ids.forEach(function(id){if(S.ans[id]===Q[id][3])sc++});S.sc=sc;view="result";draw()}
function result(){
var n=S.ids.length,p=pct(S.sc,n);
A.innerHTML=nav()+'<div class="card"><h2>Session complete</h2><div class="big">'+S.sc+' / '+n+'</div><p class="mute">'+p+'% correct · '+(S.mode=="tutor"?"Tutor":"Test")+' mode</p><div class="bar"><i style="width:'+p+'%"></i></div><button class="primary" onclick="go(\'home\')">Back to practice</button></div><div class="card"><h2>Review</h2>'+S.ids.map(function(id,j){var q=Q[id],a=S.ans[id],ok=a===q[3];return '<details><summary>'+(j+1)+'. '+(ok?"Correct":"Incorrect")+' · '+q[0]+'</summary><p>'+q[1]+'</p><p><strong>Your answer:</strong> '+(a===undefined?"No answer":q[2][a])+'<br><strong>Correct answer:</strong> '+q[2][q[3]]+'</p><p class="mute">'+q[4]+'</p>'+dg(id,"stem")+dg(id,"exp")+'</details>'}).join("")+'</div>'}
function progress(){
var tot=0,cor=0;Object.keys(D.stats).forEach(function(k){tot+=D.stats[k].a;cor+=D.stats[k].c});
var rows=T.map(function(t){var a=0,c=0;Q.forEach(function(q,i){if(q[0]==t&&D.stats[i]){a+=D.stats[i].a;c+=D.stats[i].c}});var p=pct(c,a);return '<div class="trow"><div><span>'+t+'</span><span class="mute">'+(a?p+'% of '+a:"Not started")+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("");
var rd="",streak=0;for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()-i);var e=D.days[dkey(d)]||{a:0,c:0};rd+='<div class="trow"><div><span>'+(i==0?"Today":d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))+'</span><span class="mute">'+(e.a?e.a+' answered · '+pct(e.c,e.a)+'% correct':"No practice")+'</span></div><div class="bar"><i style="width:'+Math.min(100,100*e.a/20)+'%"></i></div></div>'}
for(var j=0;j<400;j++){var dd=new Date();dd.setDate(dd.getDate()-j);var ee=D.days[dkey(dd)];if(ee&&ee.a>0)streak++;else if(j>0)break}
var ses=D.sessions.slice(-8).reverse().map(function(s){return '<div class="row" style="margin:6px 0"><span>'+new Date(s.d).toLocaleDateString()+' · '+(s.m=="tutor"?"Tutor":"Test")+(s.p&&s.p>s.n?" · partial":"")+'</span><strong>'+s.s+'/'+s.n+' ('+pct(s.s,s.n)+'%)</strong></div>'}).join("")||'<p class="mute">No sessions yet. Finish one to see it here.</p>';
A.innerHTML=nav()+'<div class="card"><h2>Overall</h2><div class="big">'+pct(cor,tot)+'%</div><p class="mute">'+cor+' correct of '+tot+' answered · '+D.sessions.length+' sessions</p></div><div class="card"><h2>Daily practice</h2><p class="mute">Goal: 20 questions a day · streak: '+streak+' day'+(streak==1?"":"s")+'</p>'+rd+'</div><div class="card"><h2>By topic</h2>'+rows+'</div><div class="card"><h2>Recent sessions</h2>'+ses+'</div>'+backupCard()+'<button class="ghost" onclick="reset()">'+(armed?"Tap again to erase all progress":"Reset progress")+'</button>'}
function reset(){if(!armed){armed=true;draw();return}D={stats:{},flags:{},sessions:[],days:{}};save();armed=false;draw()}
document.addEventListener("keydown",function(e){if(view!="quiz")return;if(e.key>="1"&&e.key<="4"){pick(+e.key-1)}else if(e.key=="Enter"){var b=document.getElementById("nx");if(b&&!b.disabled)next()}});
draw();
</script>
